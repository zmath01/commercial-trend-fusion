# ============================================================
# commercial-trend-fusion — configuration
# Single-point configuration for the whole pipeline.
# All paths are relative to the repo root.
# ============================================================

corpus:
  dir: data/corpus
  raw_dir: data/corpus/raw          # fetched papers, cat=XX/year=YYYY.csv
  sample_dir: data/corpus/sample    # small committed sample (parquet)
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  per_year_cap: 150                 # max papers per (category, year)
  api_delay: 8.0                    # seconds between arXiv API calls (rate-limit safe)
  api_retries: 5

# Canonical arXiv scope shared with zmath01/commercial-trend.
# 32 categories grouped into 15 commercial fields.
categories:
  # AI / Machine Learning (6)
  - {cat: cs.AI,   field: AI}
  - {cat: cs.LG,   field: AI}
  - {cat: cs.CL,   field: AI}
  - {cat: cs.CV,   field: AI}
  - {cat: stat.ML, field: AI}
  - {cat: cs.NE,   field: AI}
  # Applied Mathematics (2)
  - {cat: math.OC, field: AppliedMath}
  - {cat: math.NA, field: AppliedMath}
  # Computer Science (2)
  - {cat: cs.DS, field: ComputerScience}
  - {cat: cs.DC, field: ComputerScience}
  # Software Engineering (2)
  - {cat: cs.SE, field: SoftwareEngineering}
  - {cat: cs.PL, field: SoftwareEngineering}
  # Security / Cryptography (1)
  - {cat: cs.CR, field: SecurityCrypto}
  # Quantitative Finance (5)
  - {cat: q-fin.CP, field: QuantFinance}
  - {cat: q-fin.MF, field: QuantFinance}
  - {cat: q-fin.RM, field: QuantFinance}
  - {cat: q-fin.ST, field: QuantFinance}
  - {cat: q-fin.TR, field: QuantFinance}
  # FinTech / financial computing (1)
  - {cat: cs.CE, field: FinTech}
  # Quantum Computing (1)
  - {cat: quant-ph, field: QuantumComputing}
  # Quantum materials / electronics (4)
  - {cat: cond-mat.mtrl-sci, field: QuantumMaterials}
  - {cat: cond-mat.mes-hall, field: QuantumMaterials}
  - {cat: cond-mat.str-el, field: QuantumMaterials}
  - {cat: cond-mat.supr-con, field: QuantumMaterials}
  # Statistical / complex systems / emergence (2)
  - {cat: cond-mat.stat-mech, field: StatisticalComplexity}
  - {cat: cond-mat.dis-nn, field: StatisticalComplexity}
  # Quantum simulation / ultracold matter (1)
  - {cat: cond-mat.quant-gas, field: QuantumSimulation}
  # Photonics / optical technology (1)
  - {cat: physics.optics, field: Photonics}
  # Computational physics / scientific computing (1)
  - {cat: physics.comp-ph, field: ComputationalPhysics}
  # Chips / GPU / storage / architecture (2)
  - {cat: cs.AR, field: Chips}
  - {cat: cs.ET, field: Chips}
  # Digital markets / mechanism design (1)
  - {cat: cs.GT, field: DigitalMarkets}

lexicon:
  min_freq: 5
  min_pmi: 2.0
  max_n: 4
  max_terms: 30000
  top_k_per_paper: 40

annotation:
  hot_min_freq: 5

graph:
  min_edge_weight: 2

backtest:
  history_years: [2019, 2020, 2021, 2022]
  test_years: [2023, 2024, 2025]
  n_candidates: 3000
  top_k: 100
  bootstrap_iters: 1000

predict:
  history_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  n_concepts: 100
  n_pairs: 100

paths:
  lexicon: data/lexicon/lexicon.csv
  annotation_dir: data/annotation
  graph_dir: data/graphs
  results_dir: data/results
  site_dir: docs
  template_dir: web/templates
  asset_dir: web/assets

random_seed: 42
